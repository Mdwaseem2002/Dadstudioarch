<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 60" fill="none" className="w-full h-auto">
  <!-- Architectural Geometry Icon: Interlocking structure with golden ratio proportions -->
  <g transform="translate(4, 10)">
    <!-- Outer structural boundary -->
    <rect x="0" y="0" width="38" height="38" rx="2" stroke="#A9855B" stroke-width="2" fill="none" stroke-opacity="0.9"/>
    <!-- Diagonal architectural cantilever -->
    <path d="M0 38 L38 0" stroke="#A9855B" stroke-width="1.5" stroke-dasharray="3 2" stroke-opacity="0.6"/>
    <!-- Inner architectural pillar -->
    <rect x="9" y="9" width="20" height="20" stroke="#FFFFFF" stroke-width="1.8" fill="none"/>
    <!-- Precision focal dot -->
    <circle cx="19" cy="19" r="2.5" fill="#A9855B"/>
  </g>

  <!-- Typographic Wordmark -->
  <g transform="translate(56, 34)">
    <text font-family="'Manrope', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="20" letter-spacing="4.5" fill="#FFFFFF">
      DAD<tspan fill="#A9855B">STUDIO</tspan>ARCH
    </text>
    <text y="14" font-family="'Manrope', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="500" font-size="7.5" letter-spacing="4" fill="#D8D3CA" opacity="0.8">
      ARCHITECTURE &amp; BUILD
    </text>
  </g>
</svg>
